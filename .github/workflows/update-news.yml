name: Update news

on:
  schedule:
    - cron: "0 23 * * *" # 07:00 Malaysia time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest news
        run: node fetch-news.js

      - name: Commit and push berita.json when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add berita.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update daily news"
            git push
          fi
